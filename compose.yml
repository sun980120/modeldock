name: modeldock
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: modeldock
      MARIADB_USER: modeldock
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:mariadb://db:3306/modeldock
      DATABASE_USER: modeldock
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      FREELLMAPI_URL: ${FREELLMAPI_URL:-https://llm-api.intin.myds.me/v1}
      FREELLMAPI_KEY: ${FREELLMAPI_KEY:?Set the unified server-side FreeLLMAPI key}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      USER_DAILY_LIMIT: ${USER_DAILY_LIMIT:-1000000}
      SERVICE_DAILY_LIMIT: ${SERVICE_DAILY_LIMIT:-100000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
  web:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 512m
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: [127.0.0.1:8088:8088]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    mem_limit: 128m
volumes:
  database:
